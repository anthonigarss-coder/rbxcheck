[project]
name = "rbxcheck"
version = "0.1.0"
description = "Vérifie des modèles 3D (OBJ, STL, glTF/GLB, FBX) avant de les importer dans Roblox Studio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []
keywords = ["roblox", "luau", "3d", "mesh", "blender", "validator"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]

[project.scripts]
rbxcheck = "rbxcheck.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
